apiVersion: 1

providers:
  - name: paku-dashboards
    type: file
    orgId: 1
    folder: ""
    allowUiUpdates: false
    updateIntervalSeconds: 10
    options:
      path: /etc/grafana/dashboards

  - name: paku-dashboards-legacy
    type: file
    orgId: 1
    folder: "EcoFlow — Legacy"
    allowUiUpdates: false
    updateIntervalSeconds: 10
    options:
      path: /etc/grafana/dashboards_legacy
